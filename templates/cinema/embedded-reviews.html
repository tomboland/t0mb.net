<div class="film-reviews">
$for(embeddedReviews)$
<article class="embedded-review" aria-labelledby="review-$id$-heading">
  <h3 id="review-$id$-heading"><a href="$url$">$title$</a></h3>
  <p class="film-meta">Published <time datetime="$date$">$date$</time>$if(watched_date)$ · Watched $watched_date$$endif$ $partial("templates/cinema/rating.html")$</p>
  $if(spoilers)$<p class="spoiler-notice">Contains spoilers.</p>$endif$
  <div class="embedded-review-body" id="review-$id$-text">
    $partial("templates/cinema/image.html")$
    $htmlBody$
  </div>
  <p class="review-permalink"><a href="$url$">Review permalink</a></p>
</article>
$endfor$
</div>
<script src="/js/film-reviews.js" defer></script>
